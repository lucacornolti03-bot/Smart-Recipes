        // --- LIVE GOOGLE SHEET CSV SYNC ---
        async function fetchGoogleSheetData() {
            try {
                const [ingRes, recRes] = await Promise.all([
                    fetch(`${INGREDIENTS_CSV_URL}&_t=${Date.now()}`),
                    fetch(`${RECIPES_CSV_URL}&_t=${Date.now()}`)
                ]);

                if (!ingRes.ok || !recRes.ok) return;

                const ingCsvText = await ingRes.text();
                const recCsvText = await recRes.text();

                const parsedIng = Papa.parse(ingCsvText, { header: true, skipEmptyLines: true }).data;
                const parsedRec = Papa.parse(recCsvText, { header: true, skipEmptyLines: true }).data;

                if (parsedIng && parsedIng.length > 0) {
                    ingredientsData = parsedIng.map((row, idx) => {

                        const name = row['Item'] || row['Ingredient'] || row['Name'] || row['Ingrediënt'] || `Ingredient ${idx + 1}`;
                        const id = (row['ID'] || name).toLowerCase().trim().replace(/[^a-z0-9]/g, '_');
                        return {
                            id: id,
                            name: { en: name, nl: name, es: name, ar: name, tr: name }
                        };
                    });
                }

                if (parsedRec && parsedRec.length > 0) {
                    recipesData = parsedRec.map((row, idx) => {
                        const title = row['Title'] || row['Recipe'] || row['Recept'] || `Recipe ${idx + 1}`;

                        const category = categoryRaw.includes('conser') ? 'Conservation' : 'Meal';
                        const ingRaw = row['Ingredients'] || row['Ingrediënten'] || '';
                        const instructions = row['Instructions'] || row['Bereidingswijze'] || '';

                        const ingIds = ingRaw.split(/[,;]/).map(s => s.toLowerCase().trim().replace(/[^a-z0-9]/g, '_')).filter(Boolean);

                        return {
                            id: `gs_rec_${idx}`,
                            category: category,
                            title: { en: title, nl: title, es: title, ar: title, tr: title },
                            ingredients: ingIds,
                            instructions: { en: instructions, nl: instructions, es: instructions, ar: instructions, tr: instructions }
                        };
                    });
                }

                syncStatusText.textContent = translations[currentLang].syncStatus;
                renderIngredients(ingredientSearch.value.trim());
                renderRecipes();
            } catch (err) {
                console.log("Using pre-populated dataset.");
            }
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            langSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateLanguage(currentLang);
                renderIngredients();
                renderRecipes();
            });

            ingredientSearch.addEventListener('input', () => {
                const query = ingredientSearch.value.trim();
                clearSearchBtn.classList.toggle('hidden', query === '');
                renderIngredients(query);
            });

            clearSearchBtn.addEventListener('click', () => {
                ingredientSearch.value = '';
                clearSearchBtn.classList.add('hidden');
                renderIngredients();
            });

            btnClearSelection.addEventListener('click', () => {
                selectedIngredients.clear();
                updateSelectedCount();
                renderIngredients(ingredientSearch.value.trim());
                renderRecipes();
            });

            tabAll.addEventListener('click', () => setCategoryFilter('all'));
            tabMeal.addEventListener('click', () => setCategoryFilter('Meal'));
            tabConservation.addEventListener('click', () => setCategoryFilter('Conservation'));
        }

        // --- LANGUAGE SWITCHER & DIRECTION ---
        function updateLanguage(lang) {
            const t = translations[lang] || translations.en;
            const isRTL = (lang === 'ar');

            document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            if (isRTL) {
                document.body.classList.add('font-arabic');
            } else {
                document.body.classList.remove('font-arabic');
            }

            document.getElementById('app-title').textContent = t.appTitle;
            document.getElementById('app-subtitle').textContent = t.appSubtitle;
            syncStatusText.textContent = t.syncStatus;
            
            document.getElementById('heading-ingredients').childNodes[2].nodeValue = " " + t.headingIngredients;
            ingredientSearch.placeholder = t.searchPlaceholder;
            document.getElementById('available-stock-lbl').textContent = t.availableStock;
            document.getElementById('btn-clear-txt').textContent = t.btnReset;

            document.getElementById('heading-recipes').childNodes[2].nodeValue = " " + t.headingRecipes;
            document.getElementById('subheading-recipes').textContent = t.subheadingRecipes;

            document.getElementById('lbl-tab-all').textContent = t.tabAll;
            document.getElementById('lbl-tab-meal').textContent = t.tabMeal;
            document.getElementById('lbl-tab-conservation').textContent = t.tabConservation;
            document.getElementById('excel-format-note').childNodes[2].nodeValue = " " + t.excelNote;

            updateSelectedCount();
        }

        // --- RENDER INGREDIENTS LIST ---
        function renderIngredients(filterQuery = "") {
            ingredientsContainer.innerHTML = "";
            const t = translations[currentLang];

            const filtered = ingredientsData.filter(ing => {
                const nameStr = getLocalizedStr(ing.name).toLowerCase();
                return nameStr.includes(filterQuery.toLowerCase());
            });

            if (filtered.length === 0) {
                ingredientsContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs italic">
                        ${t.noIngredientsFound}
                    </div>`;
                return;
            }

            filtered.forEach(ing => {
                const isSelected = selectedIngredients.has(ing.id);
                const displayName = getLocalizedStr(ing.name);

                const itemEl = document.createElement('label');
                itemEl.className = `flex items-center justify-between p-3 rounded-xl border cursor-pointer select-none transition-all ${
                    isSelected 
                    ? 'bg-blue-50 border-blue-400 text-blue-900 shadow-xs font-semibold' 
                    : 'bg-white border-slate-200 text-slate-700 hover:border-blue-300 hover:bg-slate-50/80'
                }`;

                itemEl.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 cursor-pointer" ${isSelected ? 'checked' : ''}>
                        <span class="text-xs sm:text-sm">${displayName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-blue-600 text-sm"></i>' : ''}
                `;

                itemEl.addEventListener('change', () => {
                    if (selectedIngredients.has(ing.id)) {
                        selectedIngredients.delete(ing.id);
                    } else {
                        selectedIngredients.add(ing.id);
                    }
                    updateSelectedCount();
                    renderIngredients(ingredientSearch.value.trim());
                    renderRecipes();
                });

                ingredientsContainer.appendChild(itemEl);
            });
        }

        // --- RENDER RECIPES WITH AUTOMATIC RANKING ---
        function renderRecipes() {
            recipesContainer.innerHTML = "";
            const t = translations[currentLang];

            let list = recipesData.filter(rec => {
                if (currentCategoryFilter === 'all') return true;
                return rec.category === currentCategoryFilter;
            });

            const rankedRecipes = list.map(rec => {
                let matchCount = 0;
                const missingList = [];

                rec.ingredients.forEach(ingId => {
                    if (selectedIngredients.has(ingId)) {
                        matchCount++;
                    } else {
                        missingList.push(ingId);
                    }
                });
                const totalReq = rec.ingredients.length;
                const matchRatio = totalReq > 0 ? (matchCount / totalReq) : 0;
                const matchPct = Math.round(matchRatio * 100);

                return { ...rec, matchCount, totalReq, matchPct, matchRatio, missingList };
            });

            // Automatic Ordering: highest match count first, then match ratio
            rankedRecipes.sort((a, b) => {
                if (b.matchCount !== a.matchCount) {
                    return b.matchCount - a.matchCount;
                }
                return b.matchRatio - a.matchRatio;
            });

            if (rankedRecipes.length === 0) {
                recipesContainer.innerHTML = `
                    <div class="text-center py-12 px-4 bg-slate-50/60 rounded-xl border border-dashed border-slate-200">
                        <i class="fa-solid fa-utensils text-slate-300 text-3xl mb-2"></i>
                        <p class="text-xs sm:text-sm text-slate-500 font-medium">${t.noRecipesFound}</p>
                    </div>`;
                return;
            }

            rankedRecipes.forEach(rec => {
                const titleStr = getLocalizedStr(rec.title);
                const instructionsStr = getLocalizedStr(rec.instructions);
                const isMeal = rec.category === "Meal";
                
                const badgeText = t.matchBadge
                    .replace('{matched}', rec.matchCount)
                    .replace('{total}', rec.totalReq)
                    .replace('{pct}', rec.matchPct);
                
                const isFullMatch = rec.matchCount === rec.totalReq && rec.totalReq > 0;
                const badgeColor = isFullMatch 
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-200' 
                    : (rec.matchCount > 0 ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-100 text-slate-600 border-slate-200');

                // Available / Missing Ingredient Pills
                const ingPillsHtml = rec.ingredients.map(ingId => {
                    const ingObj = ingredientsData.find(i => i.id === ingId);
                    const name = ingObj ? getLocalizedStr(ingObj.name) : ingId.replace(/_/g, ' ');
                    const isAvailable = selectedIngredients.has(ingId);

                    return `
                        <span class="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-md border ${
                            isAvailable 
                            ? 'bg-emerald-50 text-emerald-700 border-emerald-200 font-semibold' 
                            : 'bg-slate-100 text-slate-500 border-slate-200 line-through opacity-75'
                        }">
                            <i class="fa-solid ${isAvailable ? 'fa-check text-emerald-600' : 'fa-xmark text-slate-400'} text-[9px]"></i>
                            ${name}
                        </span>`;
                }).join(" ");

                const card = document.createElement('div');
                card.className = "recipe-card bg-white rounded-xl border border-slate-200/90 p-4 sm:p-5 shadow-xs relative overflow-hidden";
                
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md ${
                                isMeal ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                            }">
                                ${isMeal ? '<i class="fa-solid fa-bowl-food me-1"></i>' + t.categoryMeal : '<i class="fa-solid fa-jar me-1"></i>' + t.categoryConservation}
                            </span>
                            <h3 class="text-base sm:text-lg font-bold text-slate-900">${titleStr}</h3>
                        </div>

                        <span class="self-start sm:self-auto text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeColor} shrink-0 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-pie text-[10px]"></i>
                            ${badgeText}
                        </span>
                    </div>

                    <div class="mb-3.5">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">${t.ingredientsNeeded}</p>
                        <div class="flex flex-wrap gap-1.5">
                            ${ingPillsHtml}
                        </div>
                    </div>

                    <details class="group border-t border-slate-100 pt-3">
                        <summary class="flex justify-between items-center text-xs font-semibold text-blue-600 cursor-pointer list-none select-none hover:text-blue-700">
                            <span><i class="fa-solid fa-list-check me-1"></i> ${t.instructions}</span>
                            <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180 text-slate-400 text-xs"></i>
                        </summary>
                        <p class="mt-2.5 text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100">
                            ${instructionsStr}
                        </p>
                    </details>
                `;

                recipesContainer.appendChild(card);
            });
        }

        // --- TAB SELECTION HANDLER ---
        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            
            [tabAll, tabMeal, tabConservation].forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-600', 'shadow-xs');
                btn.classList.add('text-slate-600');
            });

            if (cat === 'all') {
                tabAll.classList.add('bg-white', 'text-blue-600', 'shadow-xs');
            } else if (cat === 'Meal') {
                tabMeal.classList.add('bg-white', 'text-blue-600', 'shadow-xs');
            } else if (cat === 'Conservation') {
                tabConservation.classList.add('bg-white', 'text-blue-600', 'shadow-xs');
            }

            renderRecipes();
        }

        // --- UPDATE SELECTED BADGE COUNT ---
        function updateSelectedCount() {
            const count = selectedIngredients.size;
            const t = translations[currentLang];
            selectedCountBadge.textContent = t.selectedBadge.replace('{count}', count);
        }

        // --- LOCALIZATION HELPER ---
        function getLocalizedStr(item) {
            if (typeof item === 'string') return item;
            if (!item) return '';
            return item[currentLang] || item.en || Object.values(item)[0] || '';
        }
    </script>
</body>
</html>
