<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participatie Keuken Shared Recipes</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- HTML5 QR Code Scanner CDN -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- QRCodeJS Library for In-App Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 transition-all">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 my-4">
    
    <!-- Top Controls: Language & View Mode Toggle -->
    <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-3 gap-2">
      <!-- Language Selector -->
      <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-emerald-500 outline-none">
        <option value="en" selected>English</option>
        <option value="nl">Nederlands</option>
        <option value="pl">Polski</option>
        <option value="pap">Papiamento</option>
        <option value="tr">Türkçe</option>
        <option value="ar">العربية</option>
        <option value="ary">الدارجة</option>
      </select>

      <!-- Tab Switcher (Scanner vs Generator) -->
      <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-300">
        <button id="tabScannerBtn" onclick="switchTab('scanner')" class="text-xs font-semibold px-3 py-1 rounded-md bg-white text-emerald-700 shadow-sm transition">📷 Scan</button>
        <button id="tabGeneratorBtn" onclick="switchTab('generator')" class="text-xs font-semibold px-3 py-1 rounded-md text-slate-600 transition">🏷️ Generator</button>
      </div>
    </div>

    <!-- App Header -->
    <header class="text-center mb-6">
      <h1 class="text-xl font-bold text-emerald-700">🌱 Participatie Keuken</h1>
      <p id="t-app-subtitle" class="text-xs text-slate-400 mt-1 font-medium">Shared Recipes</p>
    </header>

    <!-- ================= VIEW 1: SCANNER & RECIPES ================= -->
    <div id="viewScanner">
      <p id="t-app-desc" class="text-sm text-slate-500 mb-4 text-center">Scan produce QR codes to find matching recipes</p>
      
      <!-- QR Scanner Section -->
      <div class="mb-6">
        <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-200"></div>
        <div id="scanned-result" class="mt-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-center text-emerald-800 font-medium hidden">
          <span id="t-scanned-label">Scanned Ingredient:</span> <span id="ingredient-name" class="font-bold underline"></span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2 mb-6">
        <button onclick="resetScanner()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-3 rounded-xl transition text-xs sm:text-sm">
          <span id="t-btn-scan-again">🔄 Scan Again</span>
        </button>
        <button onclick="openModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-3 rounded-xl transition text-xs sm:text-sm">
          <span id="t-btn-propose">➕ Propose Recipe</span>
        </button>
      </div>

      <!-- Recipe Results Section -->
      <section>
        <h2 id="t-heading-results" class="text-lg font-semibold mb-3 text-slate-700">Matching Recipes</h2>
        <div id="recipe-list" class="space-y-4">
          <p id="t-empty-state" class="text-slate-400 text-sm text-center py-6">Scan a produce QR code above to see recipes you can make!</p>
        </div>
      </section>
    </div>

    <!-- ================= VIEW 2: IN-APP QR GENERATOR ================= -->
    <div id="viewGenerator" class="hidden">
      <p id="t-gen-desc" class="text-sm text-slate-500 mb-4 text-center">Generate and print QR code labels for community wall produce</p>

      <!-- Quick Preset Buttons -->
      <div class="mb-4">
        <p id="t-presets-label" class="text-xs font-semibold text-slate-400 uppercase mb-2">Quick Presets:</p>
        <div class="flex flex-wrap justify-center gap-1.5">
          <button onclick="setIngredient('Tomatoes')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-2.5 py-1 rounded-lg border border-slate-200 transition">Tomatoes</button>
          <button onclick="setIngredient('Cucumbers')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-2.5 py-1 rounded-lg border border-slate-200 transition">Cucumbers</button>
          <button onclick="setIngredient('Eggplant')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-2.5 py-1 rounded-lg border border-slate-200 transition">Eggplant</button>
          <button onclick="setIngredient('Garlic')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-2.5 py-1 rounded-lg border border-slate-200 transition">Garlic</button>
        </div>
      </div>

      <!-- Custom Input Field -->
      <div class="mb-4 flex gap-2">
        <input type="text" id="ingredientInput" placeholder="Type ingredient name..." value="Tomatoes" class="flex-1 p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        <button onclick="generateQR()" id="t-gen-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition">Generate</button>
      </div>

      <!-- QR Display Box -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 flex flex-col items-center justify-center mb-4">
        <h3 id="labelDisplay" class="text-base font-bold text-slate-800 mb-3">Tomatoes</h3>
        <div id="qrcode" class="bg-white p-2.5 rounded-lg shadow-sm"></div>
      </div>

      <button onclick="window.print()" id="t-print-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-sm transition">🖨️ Print Label</button>
    </div>

  </div>

  <!-- Proposal Modal -->
  <div id="proposalModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative">
      <h3 id="t-modal-title" class="text-xl font-bold text-slate-800 mb-4">Propose a New Recipe</h3>
      
      <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
        <input type="hidden" name="apikey" value="YOUR_WEB3FORMS_ACCESS_KEY">
        
        <div>
          <label id="t-label-title" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Recipe Title</label>
          <input type="text" name="title" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label id="t-label-ingredients" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ingredients (comma separated)</label>
          <input type="text" name="ingredients" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label id="t-label-instructions" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Instructions</label>
          <textarea name="instructions" rows="3" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>
        <div>
          <label id="t-label-email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Your Email</label>
          <input type="email" name="email" required class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" id="t-btn-cancel" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 rounded-xl text-sm">Cancel</button>
          <button type="submit" id="t-btn-submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-sm">Submit for Review</button>
        </div>
      </form>
    </div>
  </div>

          ary: ["مقرونية", "دنجال", "طماطيش", "ثومة", "فرماج", "حبق"]
        },
        instructions: {
          en: "Fry cubed eggplant. Make a basic garlic tomato sauce. Toss cooked pasta with sauce, top with fried eggplant and cheese.",
          nl: "Bak blokjes aubergine. Maak een knoflook-tomatensaus. Meng de gekookte pasta met saus en voeg aubergine en kaas toe.",
          pl: "Usmaż pokrojonego w kostkę bakłażana. Zrób prosty sos pomidorowy z czosnkiem. Wymieszaj ugotowany makaron z sosem, posyp smażonym bakłażanem i serem.",
          pap: "Fray berenzenchi na kùbi. Traha un salsa di tomati simpel ku ajo. Miskla pasta kushiná ku salsa, pone berenzenchi fritá i keso riba dje.",
          tr: "Küp şeklinde doğranmış patlıcanları kızartın. Domates ve sarımsaklı sos hazırlayın. Makarnayı sosla karıştırıp servis edin.",
          ar: "اقلي مكعبات الباذنجان. حضر صلصة طماطم وثوم بسيطة. اخلط المعكرونة المطبوخة مع الصلصة وقم بتزيينها بالباذنجان والجبن.",
          ary: "قلي الدنجال مربعات. صاوب لاصوص طماطيش بالثومة. خلط المقرونية مع لاصوص وزيد الدنجال مقلي والفرماج من الفوق."
        }
      }
    ];

    let currentLang = "en";
    let lastScannedItem = "";
    let qrCodeInst = null;

    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.documentElement.dir = t.dir;

      // Update UI Texts
      document.getElementById("t-app-subtitle").innerText = t.appSubtitle;
      document.getElementById("t-app-desc").innerText = t.appDesc;
      document.getElementById("t-scanned-label").innerText = t.scannedLabel;
      document.getElementById("t-btn-scan-again").innerText = t.btnScanAgain;
      document.getElementById("t-btn-propose").innerText = t.btnPropose;
      document.getElementById("t-heading-results").innerText = t.headingResults;
      document.getElementById("t-modal-title").innerText = t.modalTitle;
      document.getElementById("t-label-title").innerText = t.labelTitle;
      document.getElementById("t-label-ingredients").innerText = t.labelIngredients;
      document.getElementById("t-label-instructions").innerText = t.labelInstructions;
      document.getElementById("t-label-email").innerText = t.labelEmail;
      document.getElementById("t-btn-cancel").innerText = t.btnCancel;
      document.getElementById("t-btn-submit").innerText = t.btnSubmit;
      document.getElementById("tabScannerBtn").innerText = t.tabScan;
      document.getElementById("tabGeneratorBtn").innerText = t.tabGen;
      document.getElementById("t-gen-desc").innerText = t.genDesc;
      document.getElementById("t-presets-label").innerText = t.presetsLabel;
      document.getElementById("t-gen-btn").innerText = t.genBtn;
      document.getElementById("t-print-btn").innerText = t.printBtn;

      if (lastScannedItem) {
        filterRecipes(lastScannedItem);
      } else {
        document.getElementById("recipe-list").innerHTML = `<p class="text-slate-400 text-sm text-center py-6">${t.emptyState}</p>`;
      }
    }

    function switchTab(tab) {
      const scannerView = document.getElementById("viewScanner");
      const generatorView = document.getElementById("viewGenerator");
      const scanBtn = document.getElementById("tabScannerBtn");
      const genBtn = document.getElementById("tabGeneratorBtn");

      if (tab === 'scanner') {
        scannerView.classList.remove("hidden");
        generatorView.classList.add("hidden");
        scanBtn.className = "text-xs font-semibold px-3 py-1 rounded-md bg-white text-emerald-700 shadow-sm transition";
        genBtn.className = "text-xs font-semibold px-3 py-1 rounded-md text-slate-600 transition";
      } else {
        scannerView.classList.add("hidden");
        generatorView.classList.remove("hidden");
        genBtn.className = "text-xs font-semibold px-3 py-1 rounded-md bg-white text-emerald-700 shadow-sm transition";
        scanBtn.className = "text-xs font-semibold px-3 py-1 rounded-md text-slate-600 transition";
        
        // Initialize generator preview if not already done
        if (!qrCodeInst) {
          qrCodeInst = new QRCode(document.getElementById("qrcode"), {
            text: "Tomatoes",
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }
    }

    function generateQR() {
      const val = document.getElementById("ingredientInput").value.trim();
      if (val) {
        document.getElementById("labelDisplay").innerText = val;
        if (qrCodeInst) {
          qrCodeInst.clear();
          qrCodeInst.makeCode(val);
        }
      }
    }

    function setIngredient(name) {
      document.getElementById("ingredientInput").value = name;
      generateQR();
    }

    function onScanSuccess(decodedText, decodedResult) {
      lastScannedItem = decodedText.trim();
      document.getElementById("ingredient-name").innerText = lastScannedItem;
      document.getElementById("scanned-result").classList.remove("hidden");

      filterRecipes(lastScannedItem);
    }

    function filterRecipes(ingredient) {
      const listContainer = document.getElementById("recipe-list");
      listContainer.innerHTML = "";
      const t = translations[currentLang];

      const matched = recipes.filter(r => {
        const langIngredients = r.ingredients[currentLang] || r.ingredients["en"];
        return langIngredients.some(i => i.toLowerCase().includes(ingredient.toLowerCase()));
      });

      if (matched.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-500 text-sm text-center py-4">${t.noMatch} "${ingredient}".</p>`;
        return;
      }

      matched.forEach(r => {
        const card = document.createElement("div");
        card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-sm";
        const titleText = r.title[currentLang] || r.title["en"];
        const ingredientsList = (r.ingredients[currentLang] || r.ingredients["en"]).join(", ");
        const instructionsText = r.instructions[currentLang] || r.instructions["en"];
        const categoryBadge = r.category === "Meal" ? t.catMeal : t.catConservation;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <h3 class="font-bold text-slate-800">${titleText}</h3>
            <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${categoryBadge}</span>
          </div>
          <p class="text-xs text-slate-500 mb-2 font-medium">${t.ingLabel} ${ingredientsList}</p>
          <p class="text-sm text-slate-600">${instructionsText}</p>
        `;
        listContainer.appendChild(card);
      });
    }

    function resetScanner() {
      lastScannedItem = "";
      document.getElementById("scanned-result").classList.add("hidden");
      document.getElementById("recipe-list").innerHTML = `<p class="text-slate-400 text-sm text-center py-6">${translations[currentLang].emptyState}</p>`;
    }

    function openModal() { document.getElementById("proposalModal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("proposalModal").classList.add("hidden"); }

    window.addEventListener("load", () => {
      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        onScanSuccess
      ).catch(err => {
        console.warn("Camera initialization error:", err);
      });
    });
  </script>
</body>
</html>
