<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participatie Keuken - QR Code Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- QRCodeJS Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 text-center">
    <h1 class="text-xl font-bold text-emerald-700 mb-1">Participatie Keuken</h1>
    <p class="text-xs text-slate-400 mb-6 font-medium">Produce QR Code Label Generator</p>

    <!-- Preset Quick Buttons for Your Ingredients -->
    <div class="mb-4">
      <p class="text-xs font-semibold text-slate-500 uppercase mb-2">Quick Presets:</p>
      <div class="flex flex-wrap justify-center gap-2">
        <button onclick="setIngredient('Tomatoes')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-200 transition">Tomatoes</button>
        <button onclick="setIngredient('Cucumbers')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-200 transition">Cucumbers</button>
        <button onclick="setIngredient('Eggplant')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-200 transition">Eggplant</button>
        <button onclick="setIngredient('Garlic')" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-200 transition">Garlic</button>
      </div>
    </div>

    <!-- Custom Input Field -->
    <div class="mb-6 flex gap-2">
      <input type="text" id="ingredientInput" placeholder="Type ingredient name..." value="Tomatoes" class="flex-1 p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
      <button onclick="generateQR()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition">Generate</button>
    </div>

    <!-- QR Code Display Box -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 flex flex-col items-center justify-center">
      <h3 id="labelDisplay" class="text-lg font-bold text-slate-800 mb-4">Tomatoes</h3>
      <div id="qrcode" class="bg-white p-3 rounded-lg shadow-sm"></div>
    </div>

    <p class="text-xs text-slate-400 mt-6">Tip: Use your browser's print function (<kbd class="bg-slate-100 px-1.5 py-0.5 rounded border">Ctrl+P</kbd> or <kbd class="bg-slate-100 px-1.5 py-0.5 rounded border">Cmd+P</kbd>) to print these labels directly for your community wall.</p>
  </div>

  <script>
    // Initialize QR Code generator instance
    let qrcode = new QRCode(document.getElementById("qrcode"), {
      text: "Tomatoes",
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    function generateQR() {
      const val = document.getElementById("ingredientInput").value.trim();
      if (val) {
        document.getElementById("labelDisplayinnerText = val;
        document.getElementById("labelDisplay").innerText = val;
        qrcode.clear();
        qrcode.makeCode(val);
      }
    }

    function setIngredient(name) {
      document.getElementById("ingredientInput").value = name;
      generateQR();
    }
  </script>

</body>
</html>
